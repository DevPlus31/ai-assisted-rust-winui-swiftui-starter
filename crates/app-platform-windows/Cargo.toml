[package]
name = "app-platform-windows"
description = "Native Windows layer over app-core for a UI shell: data folders, preferences, the shared engine handle and Win32 edge-panel glue. No UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
app-core.workspace = true
serde.workspace = true

# Only the Win32 glue is Windows-specific; everything else is
# platform-neutral so its tests also run on macOS CI.
[target.'cfg(windows)'.dependencies]
# Runtime for the generated Win32 bindings in src/edge_panel/win32/bindings.rs.
windows-link.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
